<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Launch of Mission 2030 - Mission Mode (100 Days) on 10th Aug 2026</title>
<meta name="theme-color" content="#0a0a0f">
<meta name="description" content="A dual-stage countdown Progressive Web App">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a0f'/%3E%3Ctext x='50' y='64' font-size='48' text-anchor='middle' fill='%236ee7ff' font-family='sans-serif'%3E%E2%8F%B1%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg-color: #0a0a0f;
    --bg-glow-a: #1b1035;
    --bg-glow-b: #062229;
    --text-primary: #f5f6fa;
    --text-secondary: #8a8fa3;
    --accent: #6ee7ff;
    --accent-soft: rgba(110, 231, 255, 0.15);
    --card-bg: rgba(255, 255, 255, 0.04);
    --card-border: rgba(255, 255, 255, 0.08);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(circle at 20% 20%, var(--bg-glow-a), transparent 45%),
      radial-gradient(circle at 80% 80%, var(--bg-glow-b), transparent 45%),
      var(--bg-color);
    color: var(--text-primary);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 5vw, 48px);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    padding: 24px;
  }

  .mission-title {
    max-width: 760px;
    text-align: center;
    padding: 0 8px;
  }

  .mission-title-main {
    display: block;
    font-size: clamp(1.05rem, 3.4vw, 1.75rem);
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.35;
    color: var(--text-primary);
  }

  .mission-title-date {
    display: block;
    margin-top: 8px;
    font-size: clamp(0.65rem, 2.1vw, 0.85rem);
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
  }

  #app {
    width: 100%;
    max-width: 720px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .stage.hidden {
    display: none;
  }

  .fade-out {
    animation: fadeOut 0.6s ease forwards;
  }

  .fade-in {
    animation: fadeIn 0.7s ease forwards;
  }

  @keyframes fadeOut {
    from { opacity: 1; transform: scale(1); }
    to   { opacity: 0; transform: scale(0.92); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.96); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* ---------- Stage 1 ---------- */

  #stage1-label {
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: clamp(0.7rem, 2vw, 0.9rem);
    color: var(--text-secondary);
    margin-bottom: 24px;
  }

  #stage1-number {
    font-size: clamp(6rem, 28vw, 14rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--text-primary);
    text-shadow: 0 0 60px var(--accent-soft);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Stage 2 ---------- */

  #stage2-title {
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: clamp(0.7rem, 2vw, 0.9rem);
    color: var(--text-secondary);
    margin-bottom: 32px;
  }

  .countdown-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(10px, 3vw, 24px);
    width: 100%;
  }

  .time-block {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: clamp(14px, 4vw, 28px) clamp(6px, 2vw, 16px);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 0;
  }

  .time-value {
    font-size: clamp(1.8rem, 7vw, 4rem);
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .time-label {
    margin-top: 10px;
    font-size: clamp(0.6rem, 2vw, 0.8rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  #stage2-sub {
    margin-top: 32px;
    font-size: clamp(0.75rem, 2vw, 0.95rem);
    color: var(--text-secondary);
  }

  @media (max-width: 480px) {
    .countdown-grid {
      gap: 8px;
    }
    .time-block {
      border-radius: 14px;
    }
  }
</style>
</head>
<body>

<header class="mission-title">
  <span class="mission-title-main">Launch of Mission 2030 - Mission Mode (100 Days)</span>
  <span class="mission-title-date">on 10th Aug 2026</span>
</header>

<div id="app">

  <div id="stage1" class="stage">
    <div id="stage1-label">Starting In</div>
    <div id="stage1-number">10</div>
  </div>

  <div id="stage2" class="stage hidden">
    <div id="stage2-title">Countdown</div>
    <div class="countdown-grid">
      <div class="time-block">
        <div class="time-value" id="days">100</div>
        <div class="time-label">Days</div>
      </div>
      <div class="time-block">
        <div class="time-value" id="hours">00</div>
        <div class="time-label">Hours</div>
      </div>
      <div class="time-block">
        <div class="time-value" id="minutes">00</div>
        <div class="time-label">Minutes</div>
      </div>
      <div class="time-block">
        <div class="time-value" id="seconds">00</div>
        <div class="time-label">Seconds</div>
      </div>
    </div>
    <div id="stage2-sub">Time remaining until target date</div>
  </div>

</div>

<script>
  (function () {
    "use strict";

    // ---- Target date: current time + 100 days, calculated immediately ----
    var TARGET_DATE = new Date(Date.now() + 100 * 24 * 60 * 60 * 1000);

    var stage1 = document.getElementById("stage1");
    var stage2 = document.getElementById("stage2");
    var stage1Number = document.getElementById("stage1-number");

    var daysEl = document.getElementById("days");
    var hoursEl = document.getElementById("hours");
    var minutesEl = document.getElementById("minutes");
    var secondsEl = document.getElementById("seconds");

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    // ---------------- Stage 1: 10 -> 0 ----------------
    var count = 10;
    stage1Number.textContent = count;

    var stage1Interval = setInterval(function () {
      count -= 1;
      if (count >= 0) {
        stage1Number.textContent = count;
      }
      if (count <= 0) {
        clearInterval(stage1Interval);
        transitionToStage2();
      }
    }, 1000);

    function transitionToStage2() {
      var switched = false;

      function doSwitch() {
        if (switched) return;
        switched = true;
        stage1.classList.add("hidden");
        stage2.classList.remove("hidden");
        stage2.classList.add("fade-in");
        updateStage2();
        setInterval(updateStage2, 1000);
      }

      stage1.classList.add("fade-out");
      stage1.addEventListener("animationend", doSwitch, { once: true });

      // Fallback in case the animationend event never fires (e.g. the tab
      // was backgrounded/throttled during the fade), so Stage 2 always
      // starts on time.
      setTimeout(doSwitch, 700);
    }

    // ---------------- Stage 2: Days / Hours / Minutes / Seconds ----------------
    function updateStage2() {
      var now = Date.now();
      var diff = TARGET_DATE.getTime() - now;

      if (diff <= 0) {
        daysEl.textContent = "00";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";
        return;
      }

      var totalSeconds = Math.floor(diff / 1000);
      var days = Math.floor(totalSeconds / 86400);
      var hours = Math.floor((totalSeconds % 86400) / 3600);
      var minutes = Math.floor((totalSeconds % 3600) / 60);
      var seconds = totalSeconds % 60;

      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
    }

    // ---------------- Service worker registration ----------------
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (err) {
          console.warn("Service worker registration failed:", err);
        });
      });
    }
  })();
</script>

</body>
</html>
