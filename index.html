<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mission Mode (100 Days) on 10th Aug 2026</title>
  <meta name="theme-color" content="#eef4ff">
  <meta name="description" content="A dual-stage countdown Progressive Web App">
  <link rel="manifest" href="manifest.json">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23ffffff'/%3E%3Ctext x='50' y='64' font-size='48' text-anchor='middle' fill='%23123e9e' font-family='sans-serif'%3E%E2%8F%B1%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /*
   * Color palette sampled from assets/Backdrop.png (a light corporate/fintech
   * backdrop -- skyline, globe, NASDAQ building, blue swooshes) and the
   * MindlogicX logo's cyan/purple gradient, so the UI reads as one
   * consistent, professional design instead of clashing with the artwork.
   */
    :root {
      --bg-color: #eef4ff;
      --text-primary: #0f1e3d;
      --text-secondary: #4a5b7a;
      --accent: #123e9e;
      --accent-bright: #00aeef;
      --accent-purple: #702c91;
      --accent-soft: rgba(18, 62, 158, 0.16);
      --accent-green: #0f9d63;
      --accent-warm: #d64545;
      --card-bg: rgba(255, 255, 255, 0.62);
      --card-border: rgba(18, 62, 158, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        url("assets/Backdrop.png") center center / cover no-repeat,
        var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 4vw, 36px);
      -webkit-font-smoothing: antialiased;
      padding: 32px 24px;
    }

    .mlx-logo {
      width: clamp(220px, 45vw, 250px);
      height: auto;
      display: block;
    }

    .mission-2030-logo {
      width: clamp(140px, 35vw, 360px);
      height: auto;
      display: block;
      margin: 0 auto 14px auto;
      filter: drop-shadow(0 4px 14px rgba(18, 62, 158, 0.2));
    }

    .mission-title {
      max-width: 860px;
      text-align: center;
      padding: 0 8px;
    }

    .mission-title-main {
      display: block;
      font-size: clamp(1.05rem, 3.2vw, 1.65rem);
      font-weight: 800;
      letter-spacing: 0.01em;
      line-height: 1.3;
      color: var(--text-primary);
    }

    .mission-title-date {
      display: block;
      margin-top: 10px;
      font-size: clamp(0.85rem, 2.8vw, 1.15rem);
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
    }

    /* ---------- Pre-countdown hide & Initial Render Entrance Animation ---------- */

    .pre-countdown-hide {
      display: none !important;
      opacity: 0;
    }

    .initial-render-anim {
      animation: initialRenderReveal 0.85s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes initialRenderReveal {
      0% {
        opacity: 0;
        transform: translateY(35px) scale(0.9);
        filter: blur(10px);
      }

      60% {
        opacity: 1;
        filter: blur(0);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    #app {
      width: 100%;
      max-width: 720px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .stage.hidden {
      display: none;
    }

    .fade-out {
      animation: fadeOut 0.6s ease forwards;
    }

    .fade-in {
      animation: fadeIn 0.7s ease forwards;
    }

    @keyframes fadeOut {
      from {
        opacity: 1;
        transform: scale(1);
      }

      to {
        opacity: 0;
        transform: scale(0.92);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ---------- Launch button ---------- */

    .pre-launch-hide {
      display: none !important;
    }

    .launch-button {
      width: clamp(200px, 50vw, 300px);
      height: clamp(200px, 50vw, 300px);
      border-radius: 50%;
      border: none;
      background: linear-gradient(145deg, var(--accent-bright), var(--accent) 55%, #0c2c73);
      color: #ffffff;
      font-size: clamp(1.2rem, 4.5vw, 1.9rem);
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 20px 50px rgba(18, 62, 158, 0.35), 0 0 0 8px rgba(18, 62, 158, 0.1);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      animation: launchPulse 2.2s ease-in-out infinite;
    }

    .launch-button:hover {
      transform: scale(1.04);
    }

    .launch-button:active {
      transform: scale(0.96);
    }

    @keyframes launchPulse {

      0%,
      100% {
        box-shadow: 0 20px 50px rgba(18, 62, 158, 0.35), 0 0 0 8px rgba(18, 62, 158, 0.1);
      }

      50% {
        box-shadow: 0 20px 50px rgba(18, 62, 158, 0.35), 0 0 0 18px rgba(18, 62, 158, 0.03);
      }
    }

    /* ---------- Stage 1: launch-pad progress ring ---------- */

    #stage1-label {
      letter-spacing: 0.35em;
      text-transform: uppercase;
      font-size: clamp(0.7rem, 2vw, 0.9rem);
      color: var(--text-secondary);
      margin-bottom: 28px;
    }

    .ring-wrap {
      position: relative;
      width: clamp(220px, 55vw, 320px);
      height: clamp(220px, 55vw, 320px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-track {
      fill: none;
      stroke: var(--card-border);
      stroke-width: 6;
    }

    .ring-progress {
      fill: none;
      stroke: var(--accent);
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
      filter: drop-shadow(0 0 10px var(--accent-soft));
    }

    .ring-progress.final {
      stroke: var(--accent-warm);
    }

    #stage1-number {
      position: relative;
      font-size: clamp(4rem, 16vw, 6.5rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      z-index: 1;
    }

    #stage1-number.pulse {
      animation: numberPulse 0.45s ease;
    }

    @keyframes numberPulse {
      0% {
        transform: scale(0.72);
        opacity: 0.35;
      }

      55% {
        transform: scale(1.12);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* ---------- Stage 2 ---------- */

    #stage2-title {
      letter-spacing: 0.35em;
      text-transform: uppercase;
      font-size: clamp(0.7rem, 2vw, 0.9rem);
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(10px, 3vw, 24px);
      width: 100%;
    }

    .time-block {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: clamp(14px, 4vw, 28px) clamp(6px, 2vw, 16px);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(15, 30, 60, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .time-value {
      font-size: clamp(1.8rem, 7vw, 4rem);
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .time-label {
      margin-top: 10px;
      font-size: clamp(0.6rem, 2vw, 0.8rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    #stage2-sub {
      margin-top: 32px;
      font-size: clamp(0.75rem, 2vw, 0.95rem);
      color: var(--text-secondary);
    }

    @media (max-width: 480px) {
      .countdown-grid {
        gap: 8px;
      }

      .time-block {
        border-radius: 14px;
      }
    }

    .values-wrap {
      width: 100%;
      max-width: 720px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(15, 30, 60, 0.15);
    }

    .values-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ---------- Sound controls ---------- */

    /* ---------- Celebration overlay + confetti ---------- */

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1200;
      pointer-events: none;
    }

    #celebration-overlay {
      position: fixed;
      top: 24px;
      left: 50%;
      z-index: 1150;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      box-shadow: 0 14px 40px rgba(15, 30, 60, 0.18);
      border-radius: 18px;
      padding: 14px 28px;
      max-width: min(90vw, 420px);
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(-16px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #celebration-overlay.active {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .celebration-title {
      font-size: clamp(1.05rem, 3.2vw, 1.4rem);
      font-weight: 800;
      color: var(--text-primary);
    }

    .celebration-sub {
      margin-top: 4px;
      font-size: clamp(0.7rem, 2vw, 0.85rem);
      color: var(--text-secondary);
    }

    .corner-blast {
      position: fixed;
      bottom: -30px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 174, 239, 0.85) 0%, rgba(112, 44, 145, 0.6) 40%, rgba(18, 62, 158, 0) 75%);
      filter: blur(12px);
      z-index: 1080;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .corner-blast.left {
      left: -30px;
    }

    .corner-blast.right {
      right: -30px;
    }

    #celebration-overlay.active~.corner-blast {
      opacity: 1;
      animation: blastPulse 0.35s infinite alternate ease-in-out;
    }

    @keyframes blastPulse {
      from {
        transform: scale(0.85);
        opacity: 0.6;
      }

      to {
        transform: scale(1.45);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <canvas id="confetti-canvas"></canvas>

  <img class="mlx-logo pre-countdown-hide" src="assets/mlx_logo.png" alt="MindlogicX - Architecting the Future">

  <header class="mission-title pre-countdown-hide">
    <img class="mission-2030-logo" src="assets/Mission_2030_logo.png" alt="Mission 2030 Logo">
    <span class="mission-title-main">Mission Mode (100 Days)</span>
    <span class="mission-title-date">on 10th Aug 2026</span>
  </header>

  <div id="app">

    <div id="stage1" class="stage">
      <button id="launch-button" class="launch-button" type="button">
        <span>Launch</span>
      </button>
      <div id="stage1-label" class="pre-launch-hide">Starting In</div>
      <div class="ring-wrap pre-launch-hide">
        <svg class="ring-svg" viewBox="0 0 200 200">
          <circle class="ring-track" cx="100" cy="100" r="90"></circle>
          <circle class="ring-progress" id="ring-progress" cx="100" cy="100" r="90"></circle>
        </svg>
        <div id="stage1-number">10</div>
      </div>
    </div>

    <div id="stage2" class="stage hidden">
      <div id="stage2-title">Countdown</div>
      <div class="countdown-grid">
        <div class="time-block">
          <div class="time-value" id="days">100</div>
          <div class="time-label">Days</div>
        </div>
        <div class="time-block">
          <div class="time-value" id="hours">00</div>
          <div class="time-label">Hours</div>
        </div>
        <div class="time-block">
          <div class="time-value" id="minutes">00</div>
          <div class="time-label">Minutes</div>
        </div>
        <div class="time-block">
          <div class="time-value" id="seconds">00</div>
          <div class="time-label">Seconds</div>
        </div>
      </div>
      <div id="stage2-sub">Time remaining until target date</div>
      <div class="values-wrap" style="margin-top: 24px;">
        <img src="assets/values-strip.jpg" alt="Our core values: Integrity, Ownership, Accountability, Excellence">
      </div>
    </div>

  </div>

  <div id="celebration-overlay">
    <div class="celebration-title">Mission 2030 Launched!</div>
    <div class="celebration-sub">Wealth Creation for All Mindlogicxians</div>
  </div>

  <div class="corner-blast left"></div>
  <div class="corner-blast right"></div>

  <script>
    (function () {
      "use strict";

      // ---- Target date: current time + 100 days, calculated the moment
      // the Launch button is pressed (not at page load) ----
      function getFreshTargetDate() {
        return new Date(Date.now() + 100 * 24 * 60 * 60 * 1000);
      }
      var TARGET_DATE = null;

      var stage1 = document.getElementById("stage1");
      var stage2 = document.getElementById("stage2");
      var stage1Number = document.getElementById("stage1-number");

      var daysEl = document.getElementById("days");
      var hoursEl = document.getElementById("hours");
      var minutesEl = document.getElementById("minutes");
      var secondsEl = document.getElementById("seconds");

      function pad(n) {
        return String(n).padStart(2, "0");
      }

      // =========================================================================
      // Sound engine (synthesized with Web Audio API)
      // =========================================================================

      // Always enabled and unmuted by default
      var soundEnabled = true;
      var audioCtx = null;

      function getAudioContext() {
        if (!audioCtx) {
          var AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return null;
          audioCtx = new AudioContextClass();
        }
        return audioCtx;
      }

      var fireworksAudio = new Audio("assets/fireworks_sound.mp3");
      fireworksAudio.preload = "auto";
      fireworksAudio.muted = false;
      fireworksAudio.volume = 1.0;

      var countdownVoiceAudio = new Audio("assets/countdown_voice.mp3");
      countdownVoiceAudio.preload = "auto";
      countdownVoiceAudio.muted = false;
      countdownVoiceAudio.volume = 1.0;

      function unlockAudio() {
        var ctx = getAudioContext();
        if (ctx && ctx.state === "suspended") {
          ctx.resume();
        }
      }

      unlockAudio();

      // The Launch button click is a direct, synchronous user gesture, so
      // audio.play() called from inside its handler is reliably allowed by
      // every browser's autoplay policy -- no separate unlock fallback needed.

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          if (audioCtx && audioCtx.state === "running") {
            audioCtx.suspend();
          }
          [fireworksAudio, countdownVoiceAudio].forEach(function (aud) {
            if (aud && !aud.paused) aud.pause();
          });
        } else if (soundEnabled && audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume();
        }
      });

      function stopAudioCompletely() {
        if (audioCtx && audioCtx.state !== "closed") {
          audioCtx.close();
        }
        [fireworksAudio, countdownVoiceAudio].forEach(function (aud) {
          if (aud) {
            aud.pause();
            aud.currentTime = 0;
          }
        });
      }

      window.addEventListener("pagehide", stopAudioCompletely);
      window.addEventListener("beforeunload", stopAudioCompletely);

      function playFireworksAudioFile() {
        if (!soundEnabled) return;
        try {
          var audio = fireworksAudio;
          if (audio) {
            audio.muted = false;
            audio.volume = 1.0;
            audio.currentTime = 0;
            var promise = audio.play();
            if (promise !== undefined) {
              promise.catch(function (err) {
                console.log("Fireworks sound info:", err);
                playCrackerBurst();
              });
            }
          }
        } catch (e) {
          playCrackerBurst();
        }
      }

      function playCountdownVoiceAudioFile() {
        if (!soundEnabled || !countdownVoiceAudio) return;
        try {
          countdownVoiceAudio.muted = false;
          countdownVoiceAudio.volume = 1.0;
          countdownVoiceAudio.currentTime = 0;
          var promise = countdownVoiceAudio.play();
          if (promise !== undefined) {
            promise.catch(function (err) {
              console.log("Countdown voice autoplay blocked:", err);
            });
          }
        } catch (e) { }
      }

      function stopCountdownVoiceAudioFile() {
        if (!countdownVoiceAudio) return;
        countdownVoiceAudio.pause();
        countdownVoiceAudio.currentTime = 0;
      }

      function createNoiseBuffer(ctx, durationSeconds) {
        var bufferSize = Math.max(1, Math.floor(ctx.sampleRate * durationSeconds));
        var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        var data = buffer.getChannelData(0);
        for (var i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        return buffer;
      }

      function playNoiseBurst(ctx, startTime, durationSeconds, opts) {
        opts = opts || {};
        var source = ctx.createBufferSource();
        source.buffer = createNoiseBuffer(ctx, durationSeconds);

        var filter = ctx.createBiquadFilter();
        filter.type = opts.filterType || "bandpass";
        filter.frequency.value = opts.frequency || 1200;
        filter.Q.value = opts.q || 1;

        var gain = ctx.createGain();
        var peak = opts.peak != null ? opts.peak : 0.5;
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(peak, startTime + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + durationSeconds);

        source.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        source.start(startTime);
        source.stop(startTime + durationSeconds + 0.02);
      }

      function playCrackerBurst() {
        if (!soundEnabled) return;
        var ctx = getAudioContext();
        if (!ctx || ctx.state !== "running") return;

        var now = ctx.currentTime;
        var pops = 8;
        for (var i = 0; i < pops; i++) {
          var t = now + i * (0.07 + Math.random() * 0.08);
          playNoiseBurst(ctx, t, 0.1 + Math.random() * 0.08, {
            filterType: "bandpass",
            frequency: 800 + Math.random() * 2400,
            q: 0.7,
            peak: 0.35 + Math.random() * 0.25
          });
        }
      }

      // Audio countdown beeps removed per user request
      function playCountdownBeep(count) { }

      // Fireworks Blast Sound removed per user request
      function playFireworkBlastSound() { }

      // =========================================================================
      // Canvas Fireworks Explosion Engine
      // =========================================================================

      var canvas = document.getElementById("confetti-canvas");
      var ctx2d = canvas.getContext("2d");

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      var FIREWORK_COLORS = [
        "#ffd700", "#00f2fe", "#ff007f", "#702c91",
        "#00e676", "#ff3d00", "#ffffff", "#00aeef", "#ffb703"
      ];

      var fireworksRockets = [];
      var fireworksParticles = [];
      var fireworksAnimId = null;

      function spawnFireworkRocket(side) {
        side = side || (Math.random() < 0.5 ? "left" : "right");
        var isLeft = (side === "left");
        var startX = isLeft ? (25 + Math.random() * 50) : (canvas.width - 25 - Math.random() * 50);
        var startY = canvas.height + 10;
        var destY = canvas.height * 0.12 + Math.random() * (canvas.height * 0.38);

        // Angled launch trajectory pointing inwards towards upper center from left/right corners
        var vx = isLeft ? (4 + Math.random() * 7) : -(4 + Math.random() * 7);
        var vy = -(13 + Math.random() * 6);
        var color = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];

        fireworksRockets.push({
          x: startX,
          y: startY,
          vx: vx,
          vy: vy,
          targetY: destY,
          color: color
        });
      }

      function explodeFirework(x, y, color) {
        var particleCount = 120 + Math.floor(Math.random() * 60);

        for (var i = 0; i < particleCount; i++) {
          var angle = Math.random() * Math.PI * 2;
          var speed = 2 + Math.random() * 12;
          var vx = Math.cos(angle) * speed;
          var vy = Math.sin(angle) * speed;
          var life = 1.0;
          var decay = 0.012 + Math.random() * 0.018;

          fireworksParticles.push({
            x: x,
            y: y,
            vx: vx,
            vy: vy,
            color: color || FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)],
            life: life,
            decay: decay,
            size: 2 + Math.random() * 3,
            sparkle: Math.random() > 0.4
          });
        }
      }

      function stepFireworks() {
        if (!ctx2d) return;

        // Fully clear every frame (instead of painting a translucent black
        // rect for a trail effect) so the fireworks never tint the page --
        // the main content stays clearly visible underneath the whole time.
        ctx2d.globalCompositeOperation = "source-over";
        ctx2d.clearRect(0, 0, canvas.width, canvas.height);
        ctx2d.globalCompositeOperation = "lighter";

        // Update Rockets launching from corners
        for (var i = fireworksRockets.length - 1; i >= 0; i--) {
          var r = fireworksRockets[i];
          var prevX = r.x;
          var prevY = r.y;

          r.vy += 0.14; // gravity deceleration on ascent
          r.x += r.vx;
          r.y += r.vy;

          ctx2d.beginPath();
          ctx2d.moveTo(prevX, prevY);
          ctx2d.lineTo(r.x, r.y);
          ctx2d.strokeStyle = r.color;
          ctx2d.lineWidth = 4;
          ctx2d.stroke();

          ctx2d.beginPath();
          ctx2d.arc(r.x, r.y, 4, 0, Math.PI * 2);
          ctx2d.fillStyle = "#ffffff";
          ctx2d.fill();

          if (r.y <= r.targetY || r.vy >= 0) {
            explodeFirework(r.x, r.y, r.color);
            fireworksRockets.splice(i, 1);
          }
        }

        // Update Exploding Burst Particles
        for (var j = fireworksParticles.length - 1; j >= 0; j--) {
          var p = fireworksParticles[j];
          p.vx *= 0.96;
          p.vy *= 0.96;
          p.vy += 0.15; // gravity
          p.x += p.vx;
          p.y += p.vy;
          p.life -= p.decay;

          if (p.life <= 0) {
            fireworksParticles.splice(j, 1);
            continue;
          }

          ctx2d.save();
          ctx2d.globalAlpha = Math.max(p.life, 0);
          ctx2d.fillStyle = p.sparkle && Math.random() > 0.5 ? "#ffffff" : p.color;

          ctx2d.beginPath();
          ctx2d.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx2d.fill();
          ctx2d.restore();
        }

        ctx2d.globalCompositeOperation = "source-over";

        if (fireworksRockets.length > 0 || fireworksParticles.length > 0) {
          fireworksAnimId = requestAnimationFrame(stepFireworks);
        } else {
          ctx2d.clearRect(0, 0, canvas.width, canvas.height);
          fireworksAnimId = null;
        }
      }

      function startFireworksLoop() {
        if (!fireworksAnimId) {
          fireworksAnimId = requestAnimationFrame(stepFireworks);
        }
      }

      var celebrationOverlay = document.getElementById("celebration-overlay");
      var CELEBRATION_DURATION_MS = 5000;

      function triggerCelebration() {
        unlockAudio();
        // A small non-blocking toast, not a full-screen overlay -- the main
        // page content stays visible underneath the fireworks the whole time.
        celebrationOverlay.classList.add("active");

        playFireworksAudioFile();

        // Initial volley of fireworks rockets launching from left and right bottom corners
        spawnFireworkRocket("left");
        spawnFireworkRocket("right");
        spawnFireworkRocket("left");
        spawnFireworkRocket("right");
        startFireworksLoop();

        // Continuous barrage of corner fireworks rockets launching for 5 seconds
        var startTime = Date.now();
        var fireworksInterval = setInterval(function () {
          var elapsed = Date.now() - startTime;
          if (elapsed >= CELEBRATION_DURATION_MS - 400) {
            clearInterval(fireworksInterval);
            return;
          }
          spawnFireworkRocket("left");
          spawnFireworkRocket("right");
          startFireworksLoop();
        }, 300);

        setTimeout(function () {
          celebrationOverlay.classList.remove("active");
        }, CELEBRATION_DURATION_MS);
      }

      // ---------------- Stage 1: 10 -> 0 (launch-pad progress ring) ----------------
      var STAGE1_START = 10;
      var ringProgress = document.getElementById("ring-progress");
      var ringRadius = ringProgress.r.baseVal.value;
      var ringCircumference = 2 * Math.PI * ringRadius;
      ringProgress.style.strokeDasharray = ringCircumference;

      function setRingProgress(remaining) {
        var fraction = remaining / STAGE1_START;
        ringProgress.style.strokeDashoffset = ringCircumference * (1 - fraction);
      }

      function pulseNumber() {
        stage1Number.classList.remove("pulse");
        void stage1Number.offsetWidth;
        stage1Number.classList.add("pulse");
      }

      function revealPageElementsWithAnimation() {
        var hiddenEls = document.querySelectorAll(".pre-countdown-hide");
        hiddenEls.forEach(function (el) {
          el.classList.remove("pre-countdown-hide");
        });

        var logoEl = document.querySelector(".mlx-logo");
        var titleEl = document.querySelector(".mission-title");
        var stage2El = document.getElementById("stage2");

        if (logoEl) {
          logoEl.style.animationDelay = "0.05s";
          logoEl.classList.add("initial-render-anim");
        }
        if (titleEl) {
          titleEl.style.animationDelay = "0.20s";
          titleEl.classList.add("initial-render-anim");
        }
        if (stage2El) {
          stage2El.style.animationDelay = "0.35s";
          stage2El.classList.add("initial-render-anim");
        }

        var childNodes = document.querySelectorAll(".time-block, .values-wrap");
        childNodes.forEach(function (node, index) {
          node.style.animationDelay = (0.45 + index * 0.1) + "s";
          node.classList.add("initial-render-anim");
        });
      }

      var count = STAGE1_START;
      var stage1Started = false;
      var stage1Interval = null;

      function startStage1Countdown() {
        if (stage1Started) return;
        stage1Started = true;
        count = STAGE1_START;
        stage1Number.textContent = count;
        setRingProgress(count);
        pulseNumber();
        unlockAudio();
        playCountdownVoiceAudioFile();

        stage1Interval = setInterval(function () {
          count -= 1;
          if (count > 0) {
            stage1Number.textContent = count;
            setRingProgress(count);
            pulseNumber();
          } else if (count === 0) {
            stage1Number.textContent = 0;
            setRingProgress(0);
            pulseNumber();
            ringProgress.classList.add("final");
            // Count hit 0: stop the countdown voice, reveal the main content
            // immediately, and layer fireworks on top of it (no black screen).
            clearInterval(stage1Interval);
            stopCountdownVoiceAudioFile();
            startStage2Timer();
            revealPageElementsWithAnimation();
            transitionToStage2();
            triggerCelebration();
          }
        }, 1000);
      }

      // The countdown only starts once the Launch button is pressed -- that
      // direct click is also what reliably unlocks audio playback.
      stage1Number.textContent = STAGE1_START;
      setRingProgress(STAGE1_START);

      var launchButton = document.getElementById("launch-button");
      var stage1LabelEl = document.getElementById("stage1-label");
      var ringWrapEl = document.querySelector(".ring-wrap");

      launchButton.addEventListener("click", function () {
        TARGET_DATE = getFreshTargetDate();
        unlockAudio();
        launchButton.classList.add("pre-launch-hide");
        stage1LabelEl.classList.remove("pre-launch-hide");
        ringWrapEl.classList.remove("pre-launch-hide");
        startStage1Countdown();
      });

      var stage2Interval = null;
      function startStage2Timer() {
        updateStage2();
        if (!stage2Interval) {
          stage2Interval = setInterval(updateStage2, 1000);
        }
      }

      function transitionToStage2() {
        var switched = false;

        function doSwitch() {
          if (switched) return;
          switched = true;
          stage1.classList.add("hidden");
          stage2.classList.remove("hidden");
          stage2.classList.add("fade-in");
          startStage2Timer();
        }

        stage1.classList.add("fade-out");
        stage1.addEventListener("animationend", doSwitch, { once: true });

        setTimeout(doSwitch, 700);
      }

      // ---------------- Stage 2: Days / Hours / Minutes / Seconds ----------------
      var celebrationTriggered = false;

      function updateStage2() {
        var now = Date.now();
        var diff = TARGET_DATE.getTime() - now;

        if (diff <= 0) {
          daysEl.textContent = "00";
          hoursEl.textContent = "00";
          minutesEl.textContent = "00";
          secondsEl.textContent = "00";
          if (!celebrationTriggered) {
            celebrationTriggered = true;
            triggerCelebration();
          }
          return;
        }

        var totalSeconds = Math.floor(diff / 1000);
        var days = Math.floor(totalSeconds / 86400);
        var hours = Math.floor((totalSeconds % 86400) / 3600);
        var minutes = Math.floor((totalSeconds % 3600) / 60);
        var seconds = totalSeconds % 60;

        daysEl.textContent = pad(days);
        hoursEl.textContent = pad(hours);
        minutesEl.textContent = pad(minutes);
        secondsEl.textContent = pad(seconds);
      }

      // ---------------- Service worker registration ----------------
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function (err) {
            console.warn("Service worker registration failed:", err);
          });
        });
      }
    })();
  </script>

</body>
