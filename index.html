<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Launch of Mission 2030 - Mission Mode (100 Days) on 10th Aug 2026</title>
<meta name="theme-color" content="#eef4ff">
<meta name="description" content="A dual-stage countdown Progressive Web App">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23ffffff'/%3E%3Ctext x='50' y='64' font-size='48' text-anchor='middle' fill='%23123e9e' font-family='sans-serif'%3E%E2%8F%B1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /*
   * Color palette sampled from assets/Backdrop.png (a light corporate/fintech
   * backdrop -- skyline, globe, NASDAQ building, blue swooshes) and the
   * MindlogicX logo's cyan/purple gradient, so the UI reads as one
   * consistent, professional design instead of clashing with the artwork.
   */
  :root {
    --bg-color: #eef4ff;
    --text-primary: #0f1e3d;
    --text-secondary: #4a5b7a;
    --accent: #123e9e;
    --accent-bright: #00aeef;
    --accent-purple: #702c91;
    --accent-soft: rgba(18, 62, 158, 0.16);
    --accent-green: #0f9d63;
    --accent-warm: #d64545;
    --card-bg: rgba(255, 255, 255, 0.62);
    --card-border: rgba(18, 62, 158, 0.18);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    min-height: 100%;
  }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.35), rgba(238, 244, 255, 0.55)),
      url("assets/Backdrop.png") center center / cover no-repeat,
      var(--bg-color);
    color: var(--text-primary);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(18px, 4vw, 36px);
    -webkit-font-smoothing: antialiased;
    padding: 32px 24px;
  }

  .mlx-logo {
    width: clamp(150px, 32vw, 220px);
    height: auto;
    display: block;
  }

  .mission-title {
    max-width: 760px;
    text-align: center;
    padding: 0 8px;
  }

  .mission-title-main {
    display: block;
    font-size: clamp(1.05rem, 3.4vw, 1.75rem);
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.35;
    color: var(--text-primary);
  }

  .mission-title-date {
    display: block;
    margin-top: 8px;
    font-size: clamp(0.65rem, 2.1vw, 0.85rem);
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
  }

  #app {
    width: 100%;
    max-width: 720px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .stage.hidden {
    display: none;
  }

  .fade-out {
    animation: fadeOut 0.6s ease forwards;
  }

  .fade-in {
    animation: fadeIn 0.7s ease forwards;
  }

  @keyframes fadeOut {
    from { opacity: 1; transform: scale(1); }
    to   { opacity: 0; transform: scale(0.92); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.96); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* ---------- Stage 1: launch-pad progress ring ---------- */

  #stage1-label {
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: clamp(0.7rem, 2vw, 0.9rem);
    color: var(--text-secondary);
    margin-bottom: 28px;
  }

  .ring-wrap {
    position: relative;
    width: clamp(220px, 55vw, 320px);
    height: clamp(220px, 55vw, 320px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ring-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ring-track {
    fill: none;
    stroke: var(--card-border);
    stroke-width: 6;
  }

  .ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 6;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
    filter: drop-shadow(0 0 10px var(--accent-soft));
  }

  .ring-progress.final {
    stroke: var(--accent-warm);
  }

  #stage1-number {
    position: relative;
    font-size: clamp(4rem, 16vw, 6.5rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
    z-index: 1;
  }

  #stage1-number.pulse {
    animation: numberPulse 0.45s ease;
  }

  @keyframes numberPulse {
    0% { transform: scale(0.72); opacity: 0.35; }
    55% { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ---------- Stage 2 ---------- */

  #stage2-title {
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: clamp(0.7rem, 2vw, 0.9rem);
    color: var(--text-secondary);
    margin-bottom: 32px;
  }

  .countdown-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(10px, 3vw, 24px);
    width: 100%;
  }

  .time-block {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: clamp(14px, 4vw, 28px) clamp(6px, 2vw, 16px);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(15, 30, 60, 0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 0;
  }

  .time-value {
    font-size: clamp(1.8rem, 7vw, 4rem);
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .time-label {
    margin-top: 10px;
    font-size: clamp(0.6rem, 2vw, 0.8rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  #stage2-sub {
    margin-top: 32px;
    font-size: clamp(0.75rem, 2vw, 0.95rem);
    color: var(--text-secondary);
  }

  @media (max-width: 480px) {
    .countdown-grid {
      gap: 8px;
    }
    .time-block {
      border-radius: 14px;
    }
  }

  .values-wrap {
    width: 100%;
    max-width: 720px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 14px 40px rgba(15, 30, 60, 0.15);
  }

  .values-wrap img {
    display: block;
    width: 100%;
    height: auto;
  }

  /* ---------- Sound controls ---------- */

  #sound-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 1200;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    box-shadow: 0 8px 20px rgba(18, 62, 158, 0.3);
    color: #ffffff;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  #sound-toggle:hover {
    background: #0f3486;
  }

  #sound-toggle:active {
    transform: scale(0.92);
  }

  #sound-hint {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    z-index: 1200;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(10px);
    border: 1px solid var(--card-border);
    box-shadow: 0 8px 24px rgba(15, 30, 60, 0.12);
    color: var(--text-secondary);
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    padding: 10px 18px;
    border-radius: 999px;
    opacity: 1;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }

  #sound-hint.hidden {
    opacity: 0;
  }

  /* ---------- Celebration overlay + confetti ---------- */

  #confetti-canvas {
    position: fixed;
    inset: 0;
    z-index: 1100;
    pointer-events: none;
  }

  #celebration-overlay {
    position: fixed;
    inset: 0;
    z-index: 1050;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(5, 5, 12, 0.88);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    padding: 24px;
  }

  #celebration-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .celebration-emoji {
    font-size: clamp(2.5rem, 10vw, 4.5rem);
    line-height: 1;
    margin-bottom: 16px;
  }

  .celebration-title {
    font-size: clamp(1.4rem, 5vw, 2.6rem);
    font-weight: 800;
    color: #ffffff;
    max-width: 600px;
  }

  .celebration-sub {
    margin-top: 14px;
    font-size: clamp(0.8rem, 2.4vw, 1rem);
    color: rgba(255, 255, 255, 0.78);
  }

  .corner-blast {
    position: fixed;
    bottom: -30px;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 174, 239, 0.85) 0%, rgba(112, 44, 145, 0.6) 40%, rgba(18, 62, 158, 0) 75%);
    filter: blur(12px);
    z-index: 1080;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .corner-blast.left {
    left: -30px;
  }

  .corner-blast.right {
    right: -30px;
  }

  #celebration-overlay.active ~ .corner-blast {
    opacity: 1;
    animation: blastPulse 0.35s infinite alternate ease-in-out;
  }

  @keyframes blastPulse {
    from { transform: scale(0.85); opacity: 0.6; }
    to   { transform: scale(1.45); opacity: 1; }
  }

</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<button id="sound-toggle" aria-pressed="true" aria-label="Toggle countdown sound" title="Toggle sound">🔊</button>
<div id="sound-hint">🔊 Tap anywhere to enable sound</div>

<img class="mlx-logo" src="assets/mlx_logo.png" alt="MindlogicX - Architecting the Future">

<header class="mission-title">
  <span class="mission-title-main">Launch of Mission 2030 - Mission Mode (100 Days)</span>
  <span class="mission-title-date">on 10th Aug 2026</span>
</header>

<div id="app">

  <div id="stage1" class="stage">
    <div id="stage1-label">Starting In</div>
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 200 200">
        <circle class="ring-track" cx="100" cy="100" r="90"></circle>
        <circle class="ring-progress" id="ring-progress" cx="100" cy="100" r="90"></circle>
      </svg>
      <div id="stage1-number">10</div>
    </div>
  </div>

  <div id="stage2" class="stage hidden">
    <div id="stage2-title">Countdown</div>
    <div class="countdown-grid">
      <div class="time-block">
        <div class="time-value" id="days">100</div>
        <div class="time-label">Days</div>
      </div>
      <div class="time-block">
        <div class="time-value" id="hours">00</div>
        <div class="time-label">Hours</div>
      </div>
      <div class="time-block">
        <div class="time-value" id="minutes">00</div>
        <div class="time-label">Minutes</div>
      </div>
      <div class="time-block">
        <div class="time-value" id="seconds">00</div>
        <div class="time-label">Seconds</div>
      </div>
    </div>
    <div id="stage2-sub">Time remaining until target date</div>
  </div>

</div>

<div class="values-wrap">
  <img src="assets/values-strip.jpg" alt="Our core values: Integrity, Ownership, Accountability, Excellence">
</div>

<div id="celebration-overlay">
  <div class="celebration-emoji">🎉🚀🎊</div>
  <div class="celebration-title">Mission 2030 Launched!</div>
  <div class="celebration-sub">Wealth Creation for All Mindlogicxians</div>
</div>

<div class="corner-blast left"></div>
<div class="corner-blast right"></div>

<script>
  (function () {
    "use strict";

    // ---- Target date: current time + 100 days, calculated immediately ----
    var TARGET_DATE = new Date(Date.now() + 100 * 24 * 60 * 60 * 1000);

    var stage1 = document.getElementById("stage1");
    var stage2 = document.getElementById("stage2");
    var stage1Number = document.getElementById("stage1-number");

    var daysEl = document.getElementById("days");
    var hoursEl = document.getElementById("hours");
    var minutesEl = document.getElementById("minutes");
    var secondsEl = document.getElementById("seconds");

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    // =========================================================================
    // Sound engine (synthesized with Web Audio API)
    // =========================================================================

    var SOUND_KEY = "countdown-pwa-sound-enabled";
    var soundEnabled = localStorage.getItem(SOUND_KEY) !== "false";
    var audioCtx = null;

    var soundToggleBtn = document.getElementById("sound-toggle");
    var soundHint = document.getElementById("sound-hint");

    function updateSoundToggleUI() {
      soundToggleBtn.textContent = soundEnabled ? "🔊" : "🔇";
      soundToggleBtn.setAttribute("aria-pressed", soundEnabled ? "true" : "false");
    }
    updateSoundToggleUI();

    function getAudioContext() {
      if (!audioCtx) {
        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        audioCtx = new AudioContextClass();
      }
      return audioCtx;
    }

    function unlockAudio() {
      var ctx = getAudioContext();
      if (ctx && ctx.state === "suspended") {
        ctx.resume();
      }
      if (soundHint) {
        soundHint.classList.add("hidden");
      }
    }

    ["pointerdown", "keydown", "touchstart", "click"].forEach(function (evt) {
      document.addEventListener(evt, unlockAudio, { once: true, passive: true });
    });

    setTimeout(function () {
      if (soundHint) soundHint.classList.add("hidden");
    }, 8000);

    soundToggleBtn.addEventListener("click", function () {
      soundEnabled = !soundEnabled;
      localStorage.setItem(SOUND_KEY, soundEnabled ? "true" : "false");
      updateSoundToggleUI();
      unlockAudio();
    });

    document.addEventListener("visibilitychange", function () {
      if (!audioCtx) return;
      if (document.hidden) {
        if (audioCtx.state === "running") {
          audioCtx.suspend();
        }
      } else if (soundEnabled && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    });

    function stopAudioCompletely() {
      if (audioCtx && audioCtx.state !== "closed") {
        audioCtx.close();
      }
    }

    window.addEventListener("pagehide", stopAudioCompletely);
    window.addEventListener("beforeunload", stopAudioCompletely);

    // Short tick / beep played on count change
    function playTick(isFinal) {
      if (!soundEnabled) return;
      var ctx = getAudioContext();
      if (!ctx || ctx.state !== "running") return;

      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = isFinal ? 523.25 : 880;

      var now = ctx.currentTime;
      var duration = isFinal ? 0.35 : 0.08;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(isFinal ? 0.25 : 0.14, now + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function createNoiseBuffer(ctx, durationSeconds) {
      var bufferSize = Math.max(1, Math.floor(ctx.sampleRate * durationSeconds));
      var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      return buffer;
    }

    function playNoiseBurst(ctx, startTime, durationSeconds, opts) {
      opts = opts || {};
      var source = ctx.createBufferSource();
      source.buffer = createNoiseBuffer(ctx, durationSeconds);

      var filter = ctx.createBiquadFilter();
      filter.type = opts.filterType || "bandpass";
      filter.frequency.value = opts.frequency || 1200;
      filter.Q.value = opts.q || 1;

      var gain = ctx.createGain();
      var peak = opts.peak != null ? opts.peak : 0.5;
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(peak, startTime + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + durationSeconds);

      source.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      source.start(startTime);
      source.stop(startTime + durationSeconds + 0.02);
    }

    function playCrackerBurst() {
      if (!soundEnabled) return;
      var ctx = getAudioContext();
      if (!ctx || ctx.state !== "running") return;

      var now = ctx.currentTime;
      var pops = 8;
      for (var i = 0; i < pops; i++) {
        var t = now + i * (0.07 + Math.random() * 0.08);
        playNoiseBurst(ctx, t, 0.1 + Math.random() * 0.08, {
          filterType: "bandpass",
          frequency: 800 + Math.random() * 2400,
          q: 0.7,
          peak: 0.35 + Math.random() * 0.25
        });
      }
    }

    function playFanfare() {
      if (!soundEnabled) return;
      var ctx = getAudioContext();
      if (!ctx || ctx.state !== "running") return;

      var now = ctx.currentTime;
      var notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
      notes.forEach(function (freq, index) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        var start = now + index * 0.12;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.22, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.38);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + 0.4);
      });
    }

    function playCheer() {
      if (!soundEnabled) return;
      var ctx = getAudioContext();
      if (!ctx || ctx.state !== "running") return;

      var now = ctx.currentTime;

      var whooshSource = ctx.createBufferSource();
      whooshSource.buffer = createNoiseBuffer(ctx, 1.8);
      var whooshFilter = ctx.createBiquadFilter();
      whooshFilter.type = "bandpass";
      whooshFilter.Q.value = 0.6;
      whooshFilter.frequency.setValueAtTime(300, now);
      whooshFilter.frequency.linearRampToValueAtTime(2800, now + 1.4);
      var whooshGain = ctx.createGain();
      whooshGain.gain.setValueAtTime(0.0001, now);
      whooshGain.gain.exponentialRampToValueAtTime(0.28, now + 0.6);
      whooshGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);
      whooshSource.connect(whooshFilter);
      whooshFilter.connect(whooshGain);
      whooshGain.connect(ctx.destination);
      whooshSource.start(now);
      whooshSource.stop(now + 1.85);

      var clapCount = 70;
      for (var i = 0; i < clapCount; i++) {
        var t = now + 0.15 + Math.random() * 4.5;
        playNoiseBurst(ctx, t, 0.05 + Math.random() * 0.04, {
          filterType: "highpass",
          frequency: 1800 + Math.random() * 2500,
          q: 0.9,
          peak: 0.12 + Math.random() * 0.14
        });
      }
    }

    // =========================================================================
    // Paper Blast Confetti Cannon (Left & Right Bottom Corners)
    // =========================================================================

    var canvas = document.getElementById("confetti-canvas");
    var ctx2d = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    var CONFETTI_COLORS = [
      "#123e9e", "#00aeef", "#702c91", "#0f9d63",
      "#d64545", "#ffb703", "#ff007f", "#7928ca", "#00f2fe"
    ];

    var particles = [];
    var confettiAnimId = null;

    function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
      var rot = (Math.PI / 2) * 3;
      var x = cx;
      var y = cy;
      var step = Math.PI / spikes;

      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (var i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fill();
    }

    function spawnCornerPaperBlast(side, count) {
      var isLeft = (side === "left");
      var startX = isLeft ? 15 : canvas.width - 15;
      var startY = canvas.height + 10;

      for (var i = 0; i < count; i++) {
        // Left corner: -78 deg to -20 deg (-1.36 rad to -0.35 rad) -> pointing up & right
        // Right corner: -160 deg to -102 deg (-2.79 rad to -1.78 rad) -> pointing up & left
        var minAngle = isLeft ? -1.36 : -2.79;
        var maxAngle = isLeft ? -0.35 : -1.78;
        var angle = minAngle + Math.random() * (maxAngle - minAngle);

        var speed = 15 + Math.random() * 24;
        var vx = Math.cos(angle) * speed;
        var vy = Math.sin(angle) * speed;

        var shapes = ["rect", "ribbon", "circle", "star"];
        var shape = shapes[Math.floor(Math.random() * shapes.length)];
        var size = 8 + Math.random() * 10;

        particles.push({
          x: startX,
          y: startY,
          vx: vx,
          vy: vy,
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 28,
          wobble: Math.random() * Math.PI * 2,
          wobbleSpeed: 0.08 + Math.random() * 0.12,
          size: size,
          aspectRatio: shape === "ribbon" ? 3.8 : (shape === "rect" ? 1.8 : 1),
          shape: shape,
          color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
          life: 1,
          decay: 0.003 + Math.random() * 0.0035
        });
      }
    }

    function stepParticles() {
      ctx2d.clearRect(0, 0, canvas.width, canvas.height);

      for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.vy += 0.22; // gravity
        p.vx *= 0.985; // drag
        p.vy *= 0.985;
        p.x += p.vx + Math.sin(p.wobble) * 1.8; // fluttering motion
        p.y += p.vy;
        p.wobble += p.wobbleSpeed;
        p.rotation += p.rotationSpeed;
        p.life -= p.decay;

        if (p.life <= 0 || p.y > canvas.height + 80) {
          particles.splice(i, 1);
        }
      }

      for (var j = 0; j < particles.length; j++) {
        var q = particles[j];
        ctx2d.save();
        ctx2d.translate(q.x, q.y);
        ctx2d.rotate((q.rotation * Math.PI) / 180);
        ctx2d.globalAlpha = Math.max(q.life, 0);
        ctx2d.fillStyle = q.color;

        if (q.shape === "circle") {
          ctx2d.beginPath();
          ctx2d.arc(0, 0, q.size / 2, 0, Math.PI * 2);
          ctx2d.fill();
        } else if (q.shape === "star") {
          drawStar(ctx2d, 0, 0, 5, q.size / 2, q.size / 4);
        } else {
          var width = q.size * q.aspectRatio;
          var height = q.size;
          ctx2d.fillRect(-width / 2, -height / 2, width, height);
        }

        ctx2d.restore();
      }

      if (particles.length > 0) {
        confettiAnimId = requestAnimationFrame(stepParticles);
      } else {
        confettiAnimId = null;
      }
    }

    function startConfettiLoop() {
      if (!confettiAnimId) {
        confettiAnimId = requestAnimationFrame(stepParticles);
      }
    }

    var celebrationOverlay = document.getElementById("celebration-overlay");
    var CELEBRATION_DURATION_MS = 5000;

    function triggerCelebration(onComplete) {
      unlockAudio();
      celebrationOverlay.classList.add("active");

      // Play celebration sound effects: fanfare, cracker blast, crowd cheer
      playFanfare();
      playCrackerBurst();
      setTimeout(playCheer, 200);

      // Initial high-velocity paper blast from left and right bottom corners
      spawnCornerPaperBlast("left", 110);
      spawnCornerPaperBlast("right", 110);
      startConfettiLoop();

      // Continuous paper blast cannons firing from bottom corners for 5 seconds
      var startTime = Date.now();
      var blastInterval = setInterval(function () {
        var elapsed = Date.now() - startTime;
        if (elapsed >= CELEBRATION_DURATION_MS - 400) {
          clearInterval(blastInterval);
          return;
        }
        spawnCornerPaperBlast("left", 25);
        spawnCornerPaperBlast("right", 25);
        startConfettiLoop();
        playCrackerBurst();
      }, 250);

      // Auto-close celebration overlay after 5 seconds and invoke callback
      setTimeout(function () {
        celebrationOverlay.classList.remove("active");
        if (typeof onComplete === "function") {
          onComplete();
        }
      }, CELEBRATION_DURATION_MS);
    }

    // ---------------- Stage 1: 10 -> 0 (launch-pad progress ring) ----------------
    var STAGE1_START = 10;
    var ringProgress = document.getElementById("ring-progress");
    var ringRadius = ringProgress.r.baseVal.value;
    var ringCircumference = 2 * Math.PI * ringRadius;
    ringProgress.style.strokeDasharray = ringCircumference;

    function setRingProgress(remaining) {
      var fraction = remaining / STAGE1_START;
      ringProgress.style.strokeDashoffset = ringCircumference * (1 - fraction);
    }

    function pulseNumber() {
      stage1Number.classList.remove("pulse");
      void stage1Number.offsetWidth;
      stage1Number.classList.add("pulse");
    }

    var count = STAGE1_START;
    stage1Number.textContent = count;
    setRingProgress(count);
    pulseNumber();

    var stage1Interval = setInterval(function () {
      count -= 1;
      if (count >= 0) {
        stage1Number.textContent = count;
        setRingProgress(count);
        pulseNumber();
      }
      if (count <= 0) {
        ringProgress.classList.add("final");
      }
      playTick(count <= 0);
      if (count <= 0) {
        clearInterval(stage1Interval);
        // Stage 1 countdown hit 0! Show paper blast animation from left & right bottom corners for 5s with sound
        triggerCelebration(function () {
          transitionToStage2();
        });
      }
    }, 1000);

    function transitionToStage2() {
      var switched = false;

      function doSwitch() {
        if (switched) return;
        switched = true;
        stage1.classList.add("hidden");
        stage2.classList.remove("hidden");
        stage2.classList.add("fade-in");
        updateStage2();
        setInterval(updateStage2, 1000);
      }

      stage1.classList.add("fade-out");
      stage1.addEventListener("animationend", doSwitch, { once: true });

      setTimeout(doSwitch, 700);
    }

    // ---------------- Stage 2: Days / Hours / Minutes / Seconds ----------------
    var lastStage2Seconds = null;
    var celebrationTriggered = false;

    function updateStage2() {
      var now = Date.now();
      var diff = TARGET_DATE.getTime() - now;

      if (diff <= 0) {
        daysEl.textContent = "00";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";
        if (!celebrationTriggered) {
          celebrationTriggered = true;
          triggerCelebration();
        }
        return;
      }

      var totalSeconds = Math.floor(diff / 1000);
      var days = Math.floor(totalSeconds / 86400);
      var hours = Math.floor((totalSeconds % 86400) / 3600);
      var minutes = Math.floor((totalSeconds % 3600) / 60);
      var seconds = totalSeconds % 60;

      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);

      if (seconds !== lastStage2Seconds) {
        lastStage2Seconds = seconds;
        playTick(false);
      }
    }

    // ---------------- Service worker registration ----------------
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (err) {
          console.warn("Service worker registration failed:", err);
        });
      });
    }
  })();
</script>
